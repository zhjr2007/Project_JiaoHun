<!doctype html><html lang="zh-CN" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>检修验证 · 萧山剪辫案</title><script src="./theme.js"></script><link rel="stylesheet" href="./lobby.css"><link rel="stylesheet" href="./screen.css"><script type="module" src="./inspect.mjs"></script><style>
.voice-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.voice-filters{display:flex;gap:6px;flex-wrap:wrap}
.voice-filters button{font-size:12.5px;padding:4px 11px;cursor:pointer}
.voice-filters button.active{outline:2px solid currentColor;font-weight:600}
.voice-row{border-left:3px solid rgba(128,128,128,.35);padding:10px 13px;margin-bottom:8px;background:rgba(128,128,128,.07);border-radius:2px}
.voice-row.fail{border-left-color:#b3403a}
.voice-row.warn{border-left-color:#b08a2e}
.voice-row.pass{border-left-color:#4a7a4a}
.voice-meta{display:flex;gap:9px;font-size:12px;opacity:.78;flex-wrap:wrap;align-items:center}
.voice-meta .vid{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:700;letter-spacing:.02em}
.voice-text{font-size:15.5px;margin:6px 0 4px;line-height:1.6}
.voice-text.inner{opacity:.7;font-style:italic}
.voice-hyp{font-size:12.5px;opacity:.62;line-height:1.5}
.voice-actions{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.voice-actions button{font-size:12.5px;padding:3px 12px;cursor:pointer}
.voice-actions .playing{font-size:12px;opacity:.7}
.voice-more{text-align:center;padding:12px}
.voice-row{display:flex;gap:12px;align-items:flex-start}
.voice-main{flex:1;min-width:0}
.voice-shot{width:152px;height:85px;object-fit:cover;border-radius:2px;flex:none;background:rgba(128,128,128,.12);opacity:.92}
@media (max-width:720px){.voice-shot{width:96px;height:54px}}
</style></head><body><header class="entry-header"><a class="wordmark" href="./"><span class="seal">案</span><span>检修验证<small>只读检查 · 隔离测试</small></span></a><nav><a href="./operator.html?role=inspector">检修入口</a><button id="ui-theme" type="button" hidden>深色卷宗</button><button id="inspector-logout">退出</button></nav></header><main class="inspect-page"><p class="inspect-status">不提供终端或数据库编辑。测试只使用隔离数据，不会改动真实玩家或展示场次。</p><div class="inspect-grid"><section class="inspect-card"><h2>服务与资源</h2><p class="small">版本、保存服务、关卡与资源校验</p><div class="inspect-actions"><button id="inspect-refresh">重新检查</button></div><pre id="health-result" class="inspect-result">正在读取……</pre></section><section class="inspect-card"><h2>隔离验证管线</h2><p class="small">运行预定义验证，检查结果经过脱敏。</p><div class="inspect-actions"><button id="inspect-run" class="primary">运行隔离验证</button></div><p id="inspect-status" class="status" role="status"></p><pre id="run-result" class="inspect-result">尚未运行</pre></section></div><section class="inspect-card" id="accounts-panel"><h2>账号与存档</h2><p class="small">仅检修账号可见。展开后查看关卡阶段与保存版本，不展示密码或凭据。</p><form id="account-search" class="account-search"><input id="account-query" aria-label="搜索用户名" placeholder="搜索用户名"><button type="submit">搜索</button></form><p id="account-status" class="status" role="status"></p><div id="account-results"></div><nav class="pagination"><button id="account-prev">上一页</button><span id="account-page"></span><button id="account-next">下一页</button></nav></section><section class="inspect-card" id="voice-panel"><h2>台词核查 · 文本与人声对齐</h2><p class="small">逐句播放合成人声，与台词原文同屏比对；下方同时给出 ASR 回识别结果与字符错误率，作为"是否对齐"的自动证据。</p><div class="voice-bar"><p id="voice-stats" class="status" role="status">正在读取台词清单……</p><div class="voice-filters" id="voice-filters"></div></div><div id="voice-list"></div><div class="voice-more"><button id="voice-more">加载更多</button></div></section>
</main></body></html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="same-origin"><title>萧山剪辫案</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body class="play-page"><main id="game" class="game-shell"><section class="scene" aria-label="当前场景"><div id="stage" class="stage">
<div id="background-layer" class="background-layer"></div><div class="scene-shade" aria-hidden="true"></div><div id="object-layer" class="object-layer"></div><div id="character-layer" class="character-layer"></div><div id="hotspot-layer" class="hotspot-layer" aria-label="场景调查热点"></div><div id="focus-layer" class="focus-layer"></div>
<nav class="story-controls" aria-label="剧情控制"><div class="control-left"><button id="settings-open" aria-label="设置" title="设置">⚙</button><button id="log-open" aria-label="对白回看" title="对白回看 L">LOG</button><button id="records-open" class="records-entry" aria-label="打开证佐凭据" title="证佐凭据 R">凭据</button><button id="hide-ui" aria-label="隐藏界面" title="隐藏界面 H">◉</button><button id="menu-open" aria-label="游戏菜单" title="游戏菜单">☰</button></div><div class="control-right"><button id="auto-play">自动 OFF</button><button id="fast-forward">跳过 ▸</button><button id="fullscreen" aria-label="全屏" title="全屏 F">⛶</button></div></nav>
<header class="scene-heading"><span id="scene-label">查核</span><span id="stage-title">正在打开卷宗</span><span id="will" aria-label="威信值"></span></header><span id="chapter-kind" class="sr-only">卷宗</span>
<p id="cloud-status" class="save-status" role="status">自动保存于当前浏览器</p><div id="stage-caption" class="stage-caption"></div><p id="flavor-line" class="stage-flavor" hidden>风声入案</p><div id="voice-hint" class="voice-hint" hidden><p><span class="voice-tag">沈砚 · 心声</span><span id="voice-text"></span></p></div><p id="presentation-feedback" class="presentation-feedback" role="status" hidden></p>
<section class="dialogue-panel" aria-label="对白与操作"><div class="dialogue-heading"><p id="speaker" class="speaker">沈砚</p><span id="reading-help" class="reading-help"></span></div><p id="line" aria-live="polite" tabindex="0" title="点击补全文字，再点击继续"></p><p id="ending-credit" class="ending-credit" role="status" hidden><span class="credit-tag">旁白</span><span id="ending-credit-text">恭喜完成《叫魂1768》试玩版的全部内容，感谢您的游玩！</span></p><div id="actions" class="actions"></div></section>
<div id="investigation-tools" class="investigation-tools" hidden><button id="investigate-open">调查</button><button id="talk-open">交谈</button><button id="move-open">移动</button><button id="present-open">出示</button><button id="journal">档案</button><button id="investigation-advance" class="primary">继续查办</button></div>
<p id="notice" class="notice" role="status"></p><button id="restore-ui" class="restore-ui" hidden aria-label="恢复界面">轻触恢复界面</button>
</div></section>
<dialog id="investigation" class="investigation-panel" aria-labelledby="investigation-title"><header class="modal-heading"><h2 id="investigation-title">查办</h2><button id="investigation-close">返回</button></header><p id="objective" class="small-help"></p><div id="scene-body" class="scene-controls"></div><section id="panel-dialogue" class="panel-dialogue" aria-live="polite" hidden><p id="panel-speaker" class="speaker"></p><p id="panel-line" title="点击继续"></p><div id="panel-actions" class="actions"><button id="panel-continue" class="primary">继续</button></div></section></dialog>
<dialog id="records" aria-labelledby="records-title"><div class="modal-heading"><h2 id="records-title">证佐凭据</h2><button id="close-records" aria-label="关闭证佐凭据">返回</button><p id="records-toast" class="records-toast" role="status" aria-live="polite" hidden></p></div><div class="tabs" role="group" aria-label="资料类别"><button data-tab="evidence">证物与证言</button><button data-tab="profiles">人物档案</button><button data-tab="hint">查办提示</button></div><div id="record-content"></div><div id="record-actions" class="actions"></div></dialog>
<dialog id="acquired" class="acquired-dialog" aria-labelledby="acquired-title"><p id="acquired-kind" class="acquired-kind">获取物证</p><h2 id="acquired-title">凭据</h2><div id="acquired-art" class="acquired-art"></div><p id="acquired-desc" class="acquired-desc"></p><button id="acquired-close" class="primary">收入证佐凭据</button></dialog>
<dialog id="settings" class="side-panel" aria-labelledby="settings-title"><div class="modal-heading"><h2 id="settings-title">设定</h2><button id="settings-close">返回</button></div>
<label class="setting-row" for="font-size">字号<select id="font-size"><option value="small">小</option><option value="medium">中</option><option value="large">大</option></select></label>
<label class="setting-row" for="text-speed">文字速度<select id="text-speed"><option value="32">适中</option><option value="16">较快</option><option value="0">立即显示</option></select></label>
<label class="setting-row" for="dialog-opacity">对白底色<input id="dialog-opacity" type="range" min="0" max="85" step="5" value="65"></label>
<label class="setting-row" for="auto-delay">自动等待<select id="auto-delay"><option value="1000">1 秒</option><option value="2000">2 秒</option><option value="3000">3 秒</option><option value="5000">5 秒</option></select></label>
<label class="setting-row" for="fast-speed">快进速度<select id="fast-speed"><option value="4">4 ×</option><option value="8">8 ×</option><option value="16">16 ×</option><option value="32">32 ×</option></select></label>
<label class="setting-row" for="reduce-motion"><span>减少动态效果</span><input id="reduce-motion" type="checkbox"></label><h3>键位</h3><div id="keybindings" class="keybindings"></div><p id="key-message" class="small-help" role="status"></p><button id="reset-settings">恢复默认设置</button><p class="small-help">设置仅保存在本机。输入文字时快捷键不生效。</p></dialog>
<dialog id="story-log" aria-labelledby="story-log-title"><div class="modal-heading"><h2 id="story-log-title">对白回看</h2><button id="log-close">返回</button></div><div id="log-content" class="log-content"></div></dialog>
<dialog id="game-menu" class="side-panel" aria-labelledby="game-menu-title"><div class="modal-heading"><h2 id="game-menu-title">卷宗菜单</h2><button id="menu-close">返回</button></div><nav class="menu-actions"><button id="record">证佐凭据</button><button id="node-open">选择节点</button><button id="save">导出备用存档</button><button id="load">导入备用存档</button><button id="restart">重新开始</button><button id="leave-room" hidden>退出本次展示</button><a class="brand" href="/" aria-label="萧山剪辫案首页">返回进度选择</a></nav></dialog>
<dialog id="nodes" class="side-panel" aria-labelledby="nodes-title"><div class="modal-heading"><h2 id="nodes-title">选择节点</h2><button id="nodes-close">返回</button></div><p class="small-help">直接跳到某一章的开头。跳转后当前进度会被替换，凭据、威信与已驳倒的证词都按该节点重设。</p><div id="node-list" class="node-list"></div></dialog>
<aside id="orientation-note" class="orientation-note" aria-label="横屏建议"><h2>横屏，展开这份卷宗</h2><p>旋转手机可获得完整的场景与操作布局。</p><button id="portrait-continue">继续竖屏游玩</button></aside><input id="load-file" type="file" accept=".json,application/json" hidden>
</main></body></html>
